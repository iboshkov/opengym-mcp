name: Tests

# Runs on pull requests, and is called by the publish workflow so that an image
# is only pushed after the same checks pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium --only-shell --with-deps
      - run: npm run test:browser

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (runs the test stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: opengym-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and wait for a healthy container
        run: |
          docker run -d --name mcp --read-only \
            -e PUBLIC_ORIGIN=https://gym-mcp.example.com \
            -e OPENGYM_URL=https://gym.example.com \
            opengym-mcp:ci
          for attempt in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mcp)" = healthy ] && exit 0
            sleep 2
          done
          docker logs mcp
          exit 1
